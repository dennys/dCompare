name: .NET App Build & Release

on:
  push:
    branches: [ "main","dev" ]
  workflow_dispatch:
    
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, x86]
    env:
      Solution_Name: dCompare.sln
      Project_Path: dCompare/dCompare.csproj
      Test_Project_Path: dCompare.Tests/dCompare.Tests.csproj
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    - name: 🛠 Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: 📦 Restore packages
      run: dotnet restore $env:Solution_Name
    - name: 🧪 Run unit tests
      run: dotnet test $env:Test_Project_Path --configuration ${{ matrix.configuration }} --collect:"XPlat Code Coverage" /p:ExcludeByFile="**/Properties/*"
    - name: 📈 Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool
    - name: 🧾 Generate coverage reports
      run: |
        reportgenerator -reports:**/coverage.cobertura.xml -targetdir:coveragereport -reporttypes:Html,JsonSummary -filefilters:"-**/Properties/*"
    - name: 📤 Upload to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        name: codecov-umbrella
        verbose: true
    - name: 🔨 Build App
      run: dotnet build $env:Solution_Name --configuration ${{ matrix.configuration }} --no-restore
    - name: 🚀 Publish - Framework-dependent (.NET 8)
      run: |
        dotnet publish $env:Project_Path -c ${{ matrix.configuration }} -r win-${{ matrix.platform }} --self-contained false -o publish/net8-${{ matrix.platform }}
    - name: 🚀 Publish - Self-contained
      run: |
        dotnet publish $env:Project_Path -c ${{ matrix.configuration }} -r win-${{ matrix.platform }} --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish/self-${{ matrix.platform }}
    - name: 📦 Zip Artifacts
      run: |
        Compress-Archive -Path publish/net8-${{ matrix.platform }}/* -DestinationPath dCompress-net8-${{ matrix.platform }}.zip
        Compress-Archive -Path publish/self-${{ matrix.platform }}/* -DestinationPath dCompress-self-${{ matrix.platform }}.zip
    - name: 📤 Upload ZIP Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dCompress-${{ matrix.platform }}-zips
        path: |
          dCompress-net8-${{ matrix.platform }}.zip
          dCompress-self-${{ matrix.platform }}.zip
        retention-days: 14
        if-no-files-found: error
    # - name: 🧱 Build MSI (future)
    #   uses: caphyon/advinst-github-action@main
    #   with:
    #     advinst-version: '22.0'
    #     advinst-license: ${{ secrets.ADVINST_LICENSE_KEY }}
    #     advinst-enable-automation: true
    #     aip-path: dCompareInstaller/dCompare.aip
    #     aip-build-name: DefaultBuild
    #     aip-package-name: dCompress-${{ matrix.platform }}.msi
    #     aip-output-dir: ${{ github.workspace }}/msi

    # - name: 📤 Upload MSI
    #   uses: actions/upload-artifact@v3
    #   with:
    #     name: dCompress-${{ matrix.platform }}-msi
    #     path: msi/dCompress-${{ matrix.platform }}.msi

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: 📥 Download ZIP Artifacts (x64)
      uses: actions/download-artifact@v4
      with:
        name: dCompress-x64-zips
        path: artifacts/x64/
    - name: 📥 Download ZIP Artifacts (x86)
      uses: actions/download-artifact@v4
      with:
        name: dCompress-x86-zips
        path: artifacts/x86/
    - name: 🏷️ Get Previous Tag
      id: previoustag
      uses: WyriHaximus/github-action-get-previous-tag@v1
    - name: 🔢 Get Next Patch Version
      id: semver
      uses: WyriHaximus/github-action-next-semvers@v1
      with:
        version: ${{ steps.previoustag.outputs.tag }}
    - name: 🏷️ Create Git Tag
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        git tag ${{ steps.semver.outputs.patch }}
        git push origin ${{ steps.semver.outputs.patch }}
    - name: 🚀 Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.semver.outputs.patch }}
        name: Release ${{ steps.semver.outputs.patch }}
        files: |
          artifacts/x64/dCompress-net8-x64.zip
          artifacts/x64/dCompress-self-x64.zip
          artifacts/x86/dCompress-net8-x86.zip
          artifacts/x86/dCompress-self-x86.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}