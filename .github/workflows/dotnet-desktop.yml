name: .NET App Build & Release

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: windows-latest
    env:
      Solution_Name: dCompare.sln
      Project_Path: dCompare/dCompare.csproj
      Test_Project_Path: dCompare.Tests/dCompare.Tests.csproj
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🛠 Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: 📦 Restore packages
      run: dotnet restore $env:Solution_Name

    - name: 🧪 Run unit tests
      run: dotnet test $env:Test_Project_Path --configuration Release --collect:"XPlat Code Coverage" /p:ExcludeByFile="**/Properties/*"

    - name: 🔨 Build x64
      run: dotnet publish $env:Project_Path -c Release -r win-x64 --self-contained false -o publish/net8-x64

    - name: 🔨 Build x86
      run: dotnet publish $env:Project_Path -c Release -r win-x86 --self-contained false -o publish/net8-x86

    - name: 📦 Zip x64 artifacts
      run: Compress-Archive -Path publish/net8-x64/* -DestinationPath dCompress-net8-x64.zip

    - name: 📦 Zip x86 artifacts
      run: Compress-Archive -Path publish/net8-x86/* -DestinationPath dCompress-net8-x86.zip

    - name: 🐙 Get latest tag
      id: get_latest_tag
      shell: pwsh
      run: |
        $tag = git describe --tags --abbrev=0
        echo "latest_tag=$tag" >> $env:GITHUB_OUTPUT

    - name: ⚙️ Calculate next patch version
      id: next_version
      shell: pwsh
      run: |
        $currentVersion = '${{ steps.get_latest_tag.outputs.latest_tag }}'
        $verParts = $currentVersion.TrimStart('v').Split('.')
        $patch = [int]$verParts[2] + 1
        $nextVersion = "v$($verParts[0]).$($verParts[1]).$patch"
        echo "next_version=$nextVersion" >> $env:GITHUB_OUTPUT

    - name: 🔍 Check if tag exists
      id: check_tag
      shell: pwsh
      run: |
        $tag = '${{ steps.next_version.outputs.next_version }}'
        $exists = git tag -l $tag
        if ($exists) {
          echo "tag_exists=true" >> $env:GITHUB_OUTPUT
        }
        else {
          echo "tag_exists=false" >> $env:GITHUB_OUTPUT
        }

    - name: 🏷️ Create and push git tag
      if: steps.check_tag.outputs.tag_exists == 'false'
      shell: pwsh
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        git tag ${{ steps.next_version.outputs.next_version }}
        git push origin ${{ steps.next_version.outputs.next_version }}

    - name: 🚀 Create GitHub Release
      if: steps.check_tag.outputs.tag_exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.next_version.outputs.next_version }}
        name: Release ${{ steps.next_version.outputs.next_version }}
        files: |
          dCompress-net8-x64.zip
          dCompress-net8-x86.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
