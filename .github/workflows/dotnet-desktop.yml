name: .NET App Build & Release

on:
  push:
    branches: [ "main","dev" ]
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: windows-latest
    env:
      Solution_Name: dCompare.sln
      Project_Path: dCompare/dCompare.csproj
      Test_Project_Path: dCompare.Tests/dCompare.Tests.csproj
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # 因為後面要用 git tag 推送

    - name: 🛠 Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: 📦 Restore packages
      run: dotnet restore $env:Solution_Name

    - name: 🧪 Run unit tests
      run: dotnet test $env:Test_Project_Path --configuration Release --collect:"XPlat Code Coverage" /p:ExcludeByFile="**/Properties/*"

    - name: 🔨 Build App (x64 and x86)
      run: |
        dotnet publish $env:Project_Path -c Release -r win-x64 --self-contained false -o publish/net8-x64
        dotnet publish $env:Project_Path -c Release -r win-x86 --self-contained false -o publish/net8-x86

    - name: 📦 Zip Artifacts
      run: |
        Compress-Archive -Path publish/net8-x64/* -DestinationPath dCompress-net8-x64.zip
        Compress-Archive -Path publish/net8-x86/* -DestinationPath dCompress-net8-x86.zip

    - name: 🏷️ Get Previous Tag
      id: previoustag
      uses: WyriHaximus/github-action-get-previous-tag@v1

    - name: 🔢 Get Next Patch Version
      id: semver
      uses: WyriHaximus/github-action-next-semvers@v1
      with:
        version: ${{ steps.previoustag.outputs.tag }}

    - name: 🔍 Check if Tag Exists
      id: check_tag
      run: |
        if git rev-parse ${{ steps.semver.outputs.patch }} >/dev/null 2>&1; then
          echo "Tag ${{ steps.semver.outputs.patch }} already exists, skipping release steps"
          echo "tag_exists=true" >> $GITHUB_OUTPUT
        else
          echo "tag_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: 🏷️ Create and Push Git Tag
      if: steps.check_tag.outputs.tag_exists == 'false'
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        git tag ${{ steps.semver.outputs.patch }}
        git push origin ${{ steps.semver.outputs.patch }}

    - name: 🚀 Create GitHub Release
      if: steps.check_tag.outputs.tag_exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.semver.outputs.patch }}
        name: Release ${{ steps.semver.outputs.patch }}
        files: |
          dCompress-net8-x64.zip
          dCompress-net8-x86.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
