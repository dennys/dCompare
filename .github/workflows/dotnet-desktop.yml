- name: 🔍 Check if tag exists
  id: check_tag
  shell: pwsh
  run: |
    try {
      git rev-parse ${{ steps.next_version.outputs.next_version }} -q --verify
      if ($LASTEXITCODE -eq 0) {
        echo "tag_exists=true" >> $env:GITHUB_OUTPUT
      } else {
        echo "tag_exists=false" >> $env:GITHUB_OUTPUT
      }
    }
    catch {
      echo "tag_exists=false" >> $env:GITHUB_OUTPUT
    }
